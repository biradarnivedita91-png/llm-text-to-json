<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LLM Text-to-JSON Converter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #1e293b;
        }

        .container {
            max-width: 750px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 15px #0001;
        }

        h1 {
            color: #2563eb;
        }

        textarea {
            width: 100%;
            height: 160px;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            margin-top: 15px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        pre {
            background: #eef2ff;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>LLM Text-to-JSON Converter</h1>

    <p>
        Convert unstructured text into structured JSON
        using artificial intelligence.
    </p>

    <form method="POST">
        <label for="raw_text"><strong>Enter your text:</strong></label>

        <textarea id="raw_text"
                  name="raw_text"
                  placeholder="Example: My name is Rahul. I work at Infosys..."
                  required>{{ raw_text }}</textarea>

        <br>
        <button type="submit">Convert to JSON</button>
    </form>

    {% if result %}
        <h2>Generated JSON</h2>
        <pre>{{ result }}</pre>
    {% endif %}

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
</div>
</body>
</html>
